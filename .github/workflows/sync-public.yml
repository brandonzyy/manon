name: Sync to Public Repo

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove private directories
        run: |
          # 服务器端模块
          rm -rf saas/ matrixone_graph/
          # CI/CD 配置（不暴露给用户）
          rm -rf .github/
          # 内部脚本和 Node 工具
          rm -f scripts/manon-admin.py scripts/run-saas.py scripts/github-helper.py
          rm -f package.json package-lock.json
          # 内部测试和评测
          rm -rf tests/
          # 商业文档
          rm -rf docs/
          # 内部开发指南
          rm -f CLAUDE.md
          # 敏感配置和运行时数据
          rm -f .env saas.db test_saas3.db manon.db
          rm -rf saas_indexes/ saas_repos/ indexes/

      - name: Push to public repos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 提交删除操作（仅在工作区，不影响 private 仓库历史）
          git add -A
          git diff --cached --quiet || git commit -m "sync: remove private modules"

          # Push to GitHub public repo
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/brandonzyy/manon.git
          git push public HEAD:main --force

          # Push to Gitee mirror (CN users)
          git remote add gitee https://x-access-token:${{ secrets.GITEE_TOKEN }}@gitee.com/ymxy_1_0/manon.git
          git push gitee HEAD:main --force
