name: Sync to Public Repo

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare public files
        run: |
          # 把公开文件复制到临时目录
          mkdir -p /tmp/public
          # 复制所有文件，排除私有模块
          rsync -a --exclude='.git' \
            --exclude='saas/' \
            --exclude='matrixone_graph/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='CLAUDE.md' \
            --exclude='README_CN.md' \
            --exclude='scripts/' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='conftest.py' \
            --exclude='requirements.txt' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='saas_indexes/' \
            --exclude='saas_repos/' \
            --exclude='indexes/' \
            ./ /tmp/public/
          # 保存国内版 README
          cp README_CN.md /tmp/README_CN.md 2>/dev/null || true

      - name: Push to public repos (orphan — isolated history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建 orphan 分支，历史与私有仓库完全隔离
          git checkout --orphan _public_sync
          git rm -rf . > /dev/null 2>&1
          cp -r /tmp/public/* .
          cp -r /tmp/public/.* . 2>/dev/null || true
          git add -A
          git commit -m "release: $(git describe --tags --always master 2>/dev/null || git rev-parse --short master)"

          # Push to GitHub public repo
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/brandonzyy/manon.git
          git push public HEAD:main --force

          # Swap README for Gitee (CN version)
          if [ -f /tmp/README_CN.md ]; then
            cp /tmp/README_CN.md README.md
            git add README.md
            git commit --amend --no-edit
          fi

          # Push to Gitee mirror (CN users)
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/ymxy_1_0/manon.git
          git push gitee HEAD:master --force
