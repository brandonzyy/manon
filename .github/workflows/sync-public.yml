name: Sync to Public Repo

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove private directories
        run: |
          rm -rf saas/ matrixone_graph/
          # 同时移除可能包含敏感信息的文件
          rm -f saas.db test_saas3.db manon.db
          rm -rf saas_indexes/ saas_repos/

      - name: Push to public repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 设置 public 仓库 remote
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/brandonzyy/manon.git

          # 提交删除操作（仅在工作区，不影响 private 仓库历史）
          git add -A
          git diff --cached --quiet || git commit -m "sync: remove private modules"

          git push public HEAD:master --force
