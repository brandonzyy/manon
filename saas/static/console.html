<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manon Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--cyan:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#bc8cff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:600;color:var(--cyan)}
header .spacer{flex:1}
#apiKeyInput{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;width:320px;font-size:12px}
#connectBtn{background:var(--cyan);color:#000;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
#status{font-size:12px;color:var(--text2)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{padding:8px 16px;cursor:pointer;border-radius:6px 6px 0 0;color:var(--text2);font-size:13px}
.tab.active{background:var(--bg2);color:var(--cyan);border:1px solid var(--border);border-bottom-color:var(--bg)}
.panel{display:none}.panel.active{display:block}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-size:12px;font-weight:500}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--cyan)}
.btn-danger{color:var(--red)}.btn-danger:hover{border-color:var(--red)}
.btn-primary{background:var(--cyan);color:#000;border:none;font-weight:600}
.form-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.form-row input,.form-row select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
.form-row input{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-done{background:#1a3a2a;color:var(--green)}
.badge-indexing{background:#2a2a1a;color:var(--yellow)}
.badge-error{background:#3a1a1a;color:var(--red)}
.badge-pending{background:var(--bg3);color:var(--text2)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--cyan)}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:4px}
#queryResult{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:500px;overflow:auto;display:none}
</style>
</head>
<body>
<header>
  <h1>Manon Console</h1>
  <span class="spacer"></span>
  <input id="apiKeyInput" type="password" placeholder="API Key (msk_...)">
  <button id="connectBtn" onclick="connect()">连接</button>
  <span id="status"></span>
</header>
<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('repos')">仓库</div>
    <div class="tab" onclick="switchTab('query')">查询</div>
    <div class="tab" onclick="switchTab('usage')">用量</div>
  </div>
  <div id="reposPanel" class="panel active">
    <div class="form-row">
      <input id="repoName" placeholder="仓库名称">
      <input id="repoGitUrl" placeholder="Git URL (可选)">
      <input id="repoBranch" placeholder="分支" value="main" style="max-width:100px">
      <button class="btn btn-primary" onclick="createRepo()">+ 添加仓库</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>Git URL</th><th>索引状态</th><th>操作</th></tr></thead>
      <tbody id="repoTable"></tbody>
    </table>
  </div>
  <div id="queryPanel" class="panel">
    <div class="form-row">
      <select id="queryRepo"></select>
      <select id="queryType">
        <option value="search">语义搜索</option>
        <option value="graph">图遍历</option>
        <option value="impact">影响分析</option>
      </select>
      <input id="queryInput" placeholder="查询内容...">
      <button class="btn btn-primary" onclick="runQuery()">查询</button>
    </div>
    <div id="queryResult"></div>
  </div>
  <div id="usagePanel" class="panel">
    <div class="stat-grid" id="usageStats"></div>
    <div class="card"><h3 style="margin-bottom:12px;font-size:14px">按端点统计</h3><div id="usageByEndpoint"></div></div>
  </div>
</div>
<script>
let API='',KEY='';
const $=id=>document.getElementById(id);
function hdr(){return {Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}
async function api(method,path,body){
  const opts={method,headers:hdr()};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  if(r.status===204)return null;
  if(!r.ok){const t=await r.text();throw new Error(t)}
  return r.json();
}

function connect(){
  KEY=$('apiKeyInput').value.trim();
  if(!KEY){alert('请输入 API Key');return}
  API=location.origin;
  $('status').textContent='已连接';$('status').style.color='var(--green)';
  loadRepos();loadUsage();
}

// ── Tabs ──
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',t.textContent.includes({repos:'仓库',query:'查询',usage:'用量'}[name])));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $(name+'Panel').classList.add('active');
  if(name==='usage')loadUsage();
  if(name==='repos')loadRepos();
}

// ── Repos ──
async function loadRepos(){
  try{
    const repos=await api('GET','/api/v1/repos');
    const sel=$('queryRepo');sel.innerHTML='';
    const tb=$('repoTable');tb.innerHTML='';
    repos.forEach(r=>{
      const bc={done:'badge-done',indexing:'badge-indexing',error:'badge-error'}[r.index_status]||'badge-pending';
      tb.innerHTML+=`<tr>
        <td style="font-family:monospace;font-size:12px">${r.id}</td>
        <td>${r.name}</td>
        <td style="font-size:12px;color:var(--text2)">${r.git_url||'local'}</td>
        <td><span class="badge ${bc}">${r.index_status}</span></td>
        <td>
          <button class="btn" onclick="triggerIndex('${r.id}')">索引</button>
          <button class="btn btn-danger" onclick="deleteRepo('${r.id}')">删除</button>
        </td>
      </tr>`;
      sel.innerHTML+=`<option value="${r.id}">${r.name}</option>`;
    });
  }catch(e){console.error(e)}
}

async function createRepo(){
  const name=$('repoName').value.trim();
  if(!name){alert('请输入仓库名称');return}
  await api('POST','/api/v1/repos',{name,git_url:$('repoGitUrl').value.trim(),branch:$('repoBranch').value.trim()||'main'});
  $('repoName').value='';$('repoGitUrl').value='';
  loadRepos();
}

async function triggerIndex(id){
  await api('POST',`/api/v1/repos/${id}/index`,{incremental:true});
  loadRepos();
}

async function deleteRepo(id){
  if(!confirm('确认删除？'))return;
  await api('DELETE',`/api/v1/repos/${id}`);
  loadRepos();
}

// ── Query ──
async function runQuery(){
  const repo=$('queryRepo').value;
  const type=$('queryType').value;
  const q=$('queryInput').value.trim();
  if(!repo||!q){alert('请选择仓库并输入查询');return}
  const el=$('queryResult');el.style.display='block';el.textContent='查询中...';
  try{
    let path;
    if(type==='search')path=`/api/v1/repos/${repo}/search?q=${encodeURIComponent(q)}`;
    else if(type==='graph')path=`/api/v1/repos/${repo}/graph?symbol=${encodeURIComponent(q)}`;
    else path=`/api/v1/repos/${repo}/impact?commit=${encodeURIComponent(q)}`;
    const data=await api('GET',path);
    el.textContent=JSON.stringify(data,null,2);
  }catch(e){el.textContent='Error: '+e.message}
}

// ── Usage ──
async function loadUsage(){
  try{
    const u=await api('GET','/api/v1/usage?days=30');
    $('usageStats').innerHTML=`
      <div class="stat-card"><div class="num">${u.total_calls}</div><div class="label">总调用次数</div></div>
      <div class="stat-card"><div class="num">${u.total_tokens}</div><div class="label">总 Tokens</div></div>
      <div class="stat-card"><div class="num">${u.period_days}</div><div class="label">统计天数</div></div>
      <div class="stat-card"><div class="num">${Object.keys(u.by_endpoint).length}</div><div class="label">活跃端点</div></div>`;
    const ep=$('usageByEndpoint');ep.innerHTML='<table><thead><tr><th>端点</th><th>调用次数</th></tr></thead><tbody>'+
      Object.entries(u.by_endpoint).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')+'</tbody></table>';
  }catch(e){console.error(e)}
}

// auto-connect if key in localStorage
const saved=localStorage.getItem('manon_key');
if(saved){$('apiKeyInput').value=saved}
const origConnect=connect;
connect=function(){origConnect();localStorage.setItem('manon_key',KEY)};
</script>
</body>
</html>
