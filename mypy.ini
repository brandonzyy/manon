; L1 六件套之二：类型检查。存量冻结在 scripts/l1-baselines/typing.txt，
; 比对逻辑在 scripts/check_l1.py（只此一份）。python-version 与 CI 一致钉死，
; 两台机器看到同一套语义，baseline 才可比。
[mypy]
python_version = 3.10
ignore_missing_imports = True
; 三方库一律当 Any（follow_imports=skip）：本机生成 baseline 时依赖未必在
; 路径上、CI 装了依赖，两边若解析深度不同，同一份代码会读出两套错误——
; baseline 必须跨机可比，宁可少解析库类型（库自身的类型由上游自己保证）。
follow_imports = skip
no_incremental = True
exclude = (?x)(^conftest\.py$|^\.venv/|^node_modules/|^repos/|^indexes/|^saas_repos/|^saas_indexes/|^saas_data/)
