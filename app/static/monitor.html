<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manon Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;--text:#e4e4e7;--text2:#9ca3af;--accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:600}
header h1 span{color:var(--accent2);font-weight:400;font-size:14px;margin-left:8px}
.nav-link{color:var(--accent2);text-decoration:none;font-size:13px;padding:4px 12px;border:1px solid var(--border);border-radius:6px;margin-left:auto}
.nav-link:hover{background:var(--surface2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 24px;max-width:1400px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.card h2{font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .badge{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;letter-spacing:0}
.stat-row{display:flex;gap:16px;margin-bottom:16px}
.stat{flex:1;background:var(--surface2);border-radius:8px;padding:14px;text-align:center}
.stat .value{font-size:28px;font-weight:700;color:var(--accent2)}
.stat .label{font-size:11px;color:var(--text2);margin-top:4px;text-transform:uppercase}
.full-width{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
.badge-status{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-status.idle{background:#374151;color:var(--text2)}
.badge-status.executing,.badge-status.in_progress{background:rgba(99,102,241,0.2);color:var(--accent2)}
.badge-status.done,.badge-status.completed{background:rgba(34,197,94,0.2);color:var(--green)}
.badge-status.failed{background:rgba(239,68,68,0.2);color:var(--red)}
.log-area{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;max-height:300px;overflow-y:auto;font-family:'Cascadia Code',monospace;font-size:12px;line-height:1.6;color:var(--text2)}
.log-area .entry{padding:2px 0;border-bottom:1px solid rgba(46,51,72,0.5)}
.log-area .ts{color:#6b7280;margin-right:8px}
.log-area .type{font-weight:500;margin-right:6px}
.log-area .type.in{color:var(--green)}
.log-area .type.out{color:var(--accent2)}
</style>
</head>
<body>
<header>
  <h1>Manon<span>Monitor</span></h1>
  <a href="/" class="nav-link">← 交互界面</a>
</header>
<div class="grid">
  <div class="card">
    <h2>系统状态</h2>
    <div class="stat-row">
      <div class="stat"><div class="value" id="s-gateway">-</div><div class="label">Gateway</div></div>
      <div class="stat"><div class="value" id="s-upstream">-</div><div class="label">API Server</div></div>
      <div class="stat"><div class="value" id="s-devs">0</div><div class="label">开发者连接</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Pipeline 统计</h2>
    <div class="stat-row">
      <div class="stat"><div class="value" id="s-sessions">0</div><div class="label">活跃会话</div></div>
      <div class="stat"><div class="value" id="s-tasks-done">0</div><div class="label">已完成任务</div></div>
      <div class="stat"><div class="value" id="s-tasks-failed">0</div><div class="label">失败任务</div></div>
    </div>
  </div>
  <div class="card full-width">
    <h2>LoomGraph 索引 <span class="badge" id="idx-badge" style="display:none">索引中</span></h2>
    <div class="stat-row">
      <div class="stat"><div class="value" id="s-entities">—</div><div class="label">实体</div></div>
      <div class="stat"><div class="value" id="s-relations">—</div><div class="label">关系</div></div>
      <div class="stat"><div class="value" id="s-files">—</div><div class="label">文件</div></div>
      <div class="stat"><div class="value" id="s-chunks">—</div><div class="label">Chunks</div></div>
    </div>
  </div>
  <div class="card full-width">
    <h2>活跃会话 <span class="badge" id="session-count">0</span></h2>
    <table>
      <thead><tr><th>开发者</th><th>Feature</th><th>项目</th><th>状态</th><th>任务进度</th></tr></thead>
      <tbody id="session-table"><tr><td colspan="5" style="color:var(--text2)">暂无活跃会话</td></tr></tbody>
    </table>
  </div>
  <div class="card full-width">
    <h2>消息日志</h2>
    <div class="log-area" id="log-area"></div>
  </div>
</div>
<script>
let ws = null, logEntries = [];

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/monitor`);
  ws.onopen = () => { document.getElementById('s-gateway').textContent = 'ON'; document.getElementById('s-gateway').style.color = 'var(--green)'; };
  ws.onclose = () => { document.getElementById('s-gateway').textContent = 'OFF'; document.getElementById('s-gateway').style.color = 'var(--red)'; setTimeout(connectWS, 3000); };
  ws.onmessage = (e) => { try { handleMsg(JSON.parse(e.data)); } catch {} };
}

function handleMsg(msg) {
  addLog(msg);
  if (msg.type === 'monitor-state') renderState(msg);
}

function renderState(state) {
  document.getElementById('s-upstream').textContent = state.upstream ? 'ON' : 'OFF';
  document.getElementById('s-upstream').style.color = state.upstream ? 'var(--green)' : 'var(--red)';
  document.getElementById('s-devs').textContent = state.devCount || 0;
  const sessions = state.sessions || [];
  document.getElementById('s-sessions').textContent = sessions.length;
  document.getElementById('session-count').textContent = sessions.length;
  let done = 0, failed = 0;
  const rows = sessions.map(s => {
    const tasks = s.tasks || [];
    done += tasks.filter(t => t.status === 'completed').length;
    failed += tasks.filter(t => t.status === 'failed').length;
    const progress = tasks.length ? `${tasks.filter(t=>t.status==='completed').length}/${tasks.length}` : '-';
    return `<tr><td>${s.devId}</td><td>${s.featureId || '-'}</td><td>${s.projectId || '-'}</td><td><span class="badge-status ${s.status}">${s.status}</span></td><td>${progress}</td></tr>`;
  }).join('');
  document.getElementById('session-table').innerHTML = rows || '<tr><td colspan="5" style="color:var(--text2)">暂无活跃会话</td></tr>';
  document.getElementById('s-tasks-done').textContent = done;
  document.getElementById('s-tasks-failed').textContent = failed;
  // Indexing status
  const idx = state.indexing || {};
  const idxBadge = document.getElementById('idx-badge');
  const idxCount = Object.keys(idx).length;
  if (idxCount > 0) { idxBadge.textContent = `索引中 (${idxCount})`; idxBadge.style.display = ''; }
  else { idxBadge.style.display = 'none'; }
}

// Poll LoomGraph stats from API
async function pollStats() {
  try {
    const r = await fetch('/api/v1/projects', {headers:{Authorization:'Bearer dev'}});
    if (!r.ok) return;
    const projects = await r.json();
    if (!projects.length) return;
    // Use first project's stats
    const sr = await fetch(`/api/v1/projects/${projects[0].id}/stats`, {headers:{Authorization:'Bearer dev'}});
    if (!sr.ok) return;
    const s = await sr.json();
    document.getElementById('s-entities').textContent = s.entities ?? '—';
    document.getElementById('s-relations').textContent = s.relations ?? '—';
    document.getElementById('s-files').textContent = s.files ?? '—';
    document.getElementById('s-chunks').textContent = s.chunks ?? '—';
  } catch {}
}
setInterval(pollStats, 15000);
pollStats();

function addLog(msg) {
  const ts = new Date().toLocaleTimeString();
  const dir = msg._dir || (msg.type?.startsWith('feature-request') || msg.type?.startsWith('user-') ? 'in' : 'out');
  logEntries.unshift({ ts, type: msg.type, dir, data: JSON.stringify(msg).slice(0, 200) });
  if (logEntries.length > 200) logEntries.length = 200;
  const el = document.getElementById('log-area');
  el.innerHTML = logEntries.slice(0, 50).map(e =>
    `<div class="entry"><span class="ts">${e.ts}</span><span class="type ${e.dir}">${e.dir === 'in' ? '←' : '→'}</span><span class="type">${e.type}</span>${e.data.slice(0, 120)}</div>`
  ).join('');
}

// Poll health
async function pollHealth() {
  try {
    const r = await fetch('/health');
    if (r.ok) { document.getElementById('s-gateway').textContent = 'ON'; document.getElementById('s-gateway').style.color = 'var(--green)'; }
  } catch {}
}
setInterval(pollHealth, 10000);
pollHealth();
connectWS();
</script>
</body>
</html>
